name: Edition

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.16'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: Install typesetting tools
        run: uv run --locked python scripts/install_tools.py
      - name: Validate and build both PDFs
        run: uv run --locked python scripts/build.py check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edition
          path: |
            build/*.pdf
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  lean:
    name: Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: validation/lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          leanchecker: 'true'
          leanchecker-args: '--fresh EgorychevChecks'
      - name: Check declaration axioms
        run: python3 scripts/check_axioms.py

  release:
    # Every commit on main is released: tag YYYY-MM-DD.N (build date in UTC
    # and build number), the PDFs and their SHA256SUMS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pdf, lean]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edition
          path: build
      - name: Publish the release of this commit
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          TITLE: Egorychev, Integral Representation and the Computation of Combinatorial Sums
        run: |
          if [[ -f SHA256SUMS ]]; then sha256sum --check SHA256SUMS; fi
          sha256sum -- *.pdf > SHA256SUMS
          date=$(date -u +%F)
          tag="$date.$BUILD"
          latest=false
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" == "$SOURCE_SHA" ]]; then
            latest=true
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --latest="$latest" \
              --title "$TITLE · $date · build $BUILD" \
              --notes "Built on $date (UTC) from commit $SOURCE_SHA."
          fi
          gh release upload "$tag" ./*.pdf SHA256SUMS --clobber
